<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epistelle | Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <h1>EPISTELLE</h1>
            <p class="subtitle">For the things worth pondering.</p>
        </header>

        <section class="quote-box">
            <p id="quote">Your quote will appear here.</p>
            <p id="author">Author</p>
        </section>

        <button id="quoteBtn">Get a Quote</button>

        <p id="error"></p>

    </main>

    <script src="script.js"></script>
</body>
</html>
